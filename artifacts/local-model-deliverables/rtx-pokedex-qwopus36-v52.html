<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>POKEDEX - Benchmark v5.2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* POKEMON POKEDEX STYLES */
:root {
  --pk-bg: #0D1117;
  --pk-accent: #E3350D;
  --pk-text: #E6EDF3;
  --pk-glass: rgba(255, 255, 255, 0.05);
  --pk-fire: #F08030;
  --pk-water: #6890F0;
  --pk-grass: #78C850;
  --pk-electric: #F8D030;
  --pk-psychic: #F85888;
  --pk-ice: #98D8D8;
  --pk-dragon: #7038F8;
  --pk-dark: #705848;
  --pk-fairy: #EE99AC;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background-color: var(--pk-bg);
  color: var(--pk-text);
  font-family: 'Inter', sans-serif;
  line-height: 1.5;
  overflow-x: hidden;
}

.pk-app-container {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  position: relative;
}

.pk-header {
  background: var(--pk-glass);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  padding: 1rem 2rem;
  position: sticky;
  top: 0;
  z-index: 100;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.pk-logo {
  font-family: 'Press Start 2P', cursive;
  font-size: 1.5rem;
  color: var(--pk-accent);
  letter-spacing: 2px;
  text-transform: uppercase;
}

.pk-search-container {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

#pk-search-input {
  background: rgba(0, 0, 0, 0.3);
  border: 1px solid rgba(255, 255, 255, 0.2);
  color: var(--pk-text);
  padding: 0.5rem 1rem;
  border-radius: 4px;
  font-family: 'Inter', sans-serif;
  font-size: 0.9rem;
  width: 200px;
  outline: none;
  transition: border-color 0.3s ease;
}

#pk-search-input:focus {
  border-color: var(--pk-accent);
}

.pk-type-filters {
  display: flex;
  gap: 0.5rem;
  flex-wrap: wrap;
  padding: 1rem 2rem;
  max-width: 1200px;
  margin: 0 auto;
}

.pk-filter-btn {
  background: var(--pk-glass);
  border: 1px solid rgba(255, 255, 255, 0.1);
  color: var(--pk-text);
  padding: 0.4rem 0.8rem;
  border-radius: 4px;
  cursor: pointer;
  font-family: 'Inter', sans-serif;
  font-size: 0.8rem;
  transition: all 0.3s ease;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.pk-filter-btn:hover,
.pk-filter-btn.active {
  background: var(--pk-accent);
  border-color: var(--pk-accent);
  transform: translateY(-2px);
}

.pk-pokemon-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 1.5rem;
  padding: 1rem 2rem;
  max-width: 1200px;
  margin: 0 auto;
}

.pk-card {
  background: var(--pk-glass);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 8px;
  padding: 1.5rem;
  position: relative;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.pk-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
  border-color: rgba(255, 255, 255, 0.2);
}

.pk-card-id {
  font-family: 'Press Start 2P', cursive;
  font-size: 0.8rem;
  color: rgba(255, 255, 255, 0.4);
  margin-bottom: 0.5rem;
}

.pk-card-img {
  width: 120px;
  height: 120px;
  margin: 1rem 0;
  image-rendering: pixelated;
}

.pk-card-name {
  font-family: 'Inter', sans-serif;
  font-size: 1.1rem;
  font-weight: 600;
  margin-bottom: 0.5rem;
  text-align: center;
}

.pk-type-badge {
  display: inline-block;
  padding: 0.2rem 0.6rem;
  border-radius: 4px;
  font-size: 0.7rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-top: 0.5rem;
}

.pk-type-fire { background: var(--pk-fire); color: #fff; }
.pk-type-water { background: var(--pk-water); color: #fff; }
.pk-type-grass { background: var(--pk-grass); color: #fff; }
.pk-type-electric { background: var(--pk-electric); color: #fff; }
.pk-type-psychic { background: var(--pk-psychic); color: #fff; }
.pk-type-ice { background: var(--pk-ice); color: #fff; }
.pk-type-dragon { background: var(--pk-dragon); color: #fff; }
.pk-type-dark { background: var(--pk-dark); color: #fff; }
.pk-type-fairy { background: var(--pk-fairy); color: #fff; }

.pk-pagination {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 1rem;
  padding: 2rem;
  margin-top: 2rem;
}

.pk-prev-btn,
.pk-next-btn {
  background: var(--pk-glass);
  border: 1px solid rgba(255, 255, 255, 0.2);
  color: var(--pk-text);
  padding: 0.6rem 1.2rem;
  border-radius: 4px;
  cursor: pointer;
  font-family: 'Inter', sans-serif;
  transition: all 0.3s ease;
}

.pk-prev-btn:hover,
.pk-next-btn:hover {
  background: var(--pk-accent);
  border-color: var(--pk-accent);
}

.pk-prev-btn:disabled,
.pk-next-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.pk-page-info {
  font-family: 'Press Start 2P', cursive;
  font-size: 0.8rem;
  color: rgba(255, 255, 255, 0.6);
}

.pk-modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.8);
  backdrop-filter: blur(8px);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 1000;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}

.pk-modal-overlay.active {
  opacity: 1;
  pointer-events: auto;
}

#pk-detail-modal {
  width: 100%;
  max-width: 600px;
  background: var(--pk-glass);
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 12px;
  padding: 2rem;
  position: relative;
  max-height: 90vh;
  overflow-y: auto;
}

#pk-modal-close {
  position: absolute;
  top: 1rem;
  right: 1rem;
  background: none;
  border: none;
  color: var(--pk-text);
  font-size: 1.5rem;
  cursor: pointer;
  transition: color 0.3s ease;
}

#pk-modal-close:hover {
  color: var(--pk-accent);
}

.pk-modal-img {
  width: 150px;
  height: 150px;
  margin: 1rem auto;
  display: block;
  image-rendering: pixelated;
}

.pk-modal-name {
  font-family: 'Inter', sans-serif;
  font-size: 1.5rem;
  text-align: center;
  margin-bottom: 1rem;
}

.pk-modal-stats {
  margin-top: 1rem;
}

.pk-stat-row {
  display: flex;
  justify-content: space-between;
  margin-bottom: 0.5rem;
  font-family: 'Inter', sans-serif;
  font-size: 0.9rem;
}

.pk-stat-bar {
  height: 6px;
  background: rgba(255, 255, 255, 0.1);
  border-radius: 3px;
</style>
</head>
<body>
<div class="pk-container">
  <header class="pk-header">
    <h1>POKEDEX</h1>
    <input type="text" id="pk-search-input" placeholder="Search Pokémon..." aria-label="Search Pokémon" />
    <div id="pk-type-filters" class="pk-type-filters" role="group" aria-label="Filter by type"></div>
  </header>
  <main class="pk-main">
    <div id="pk-loading-state" class="pk-state pk-loading" hidden aria-live="polite">Loading...</div>
    <div id="pk-error-state" class="pk-state pk-error" hidden aria-live="polite">Error loading data.</div>
    <div id="pk-pokemon-grid" class="pk-grid" role="grid" aria-label="Pokémon Grid"></div>
    <div id="pk-empty-state" class="pk-state pk-empty" hidden>No results found.</div>
    <nav class="pk-pagination" aria-label="Pagination">
      <button id="pk-prev-btn" class="pk-btn" aria-label="Previous page">←</button>
      <span id="pk-page-info" class="pk-page-info" aria-live="polite"></span>
      <button id="pk-next-btn" class="pk-btn" aria-label="Next page">→</button>
    </nav>
  </main>
  <div id="pk-detail-modal" class="pk-modal" hidden role="dialog" aria-modal="true" aria-labelledby="pk-modal-title">
    <button id="pk-modal-close" class="pk-modal-close" aria-label="Close modal">&times;</button>
    <div id="pk-modal-content" class="pk-modal-content"></div>
  </div>
</div>
<script>
(async function init() {
  let searchInput = document.getElementById('pk-search-input');
  let typeFilters = document.getElementById('pk-type-filters');
  let pokemonGrid = document.getElementById('pk-pokemon-grid');
  let prevBtn = document.getElementById('pk-prev-btn');
  let nextBtn = document.getElementById('pk-next-btn');
  let pageInfo = document.getElementById('pk-page-info');
  let detailModal = document.getElementById('pk-detail-modal');
  let modalClose = document.getElementById('pk-modal-close');
  let modalContent = document.getElementById('pk-modal-content');
  let loadingState = document.getElementById('pk-loading-state');
  let errorState = document.getElementById('pk-error-state');
  let emptyState = document.getElementById('pk-empty-state');

  let currentOffset = 0;
  let allPokemon = [];
  let filteredPokemon = [];
  let debounceTimer = null;

  async function fetchPokemonList(offset) {
    try {
      let url = 'https://pokeapi.co/api/v2/pokemon?limit=20&offset=' + offset;
      let r = await fetch(url);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      let d = await r.json();
      allPokemon = d.results;
      filteredPokemon = d.results;
      renderCards();
    } catch(e) {
      showError(e.message);
    }
  }

  function renderCards() {
    if (loadingState) loadingState.style.display = 'none';
    if (errorState) errorState.style.display = 'none';
    if (emptyState) emptyState.style.display = 'none';
    if (pokemonGrid) {
      pokemonGrid.innerHTML = '';
      if (filteredPokemon.length === 0) {
        if (emptyState) emptyState.style.display = 'block';
        return;
      }
      filteredPokemon.forEach(function(p) {
        let card = document.createElement('div');
        card.className = 'pokemon-card';
        let id = (p.url || '').split('/').filter(Boolean).pop();
        let img = document.createElement('img');
        img.src = 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/' + id + '.png';
        img.onerror = function() {
          this.onerror = null;
          this.src = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Crect width='120' height='120' rx='18' fill='%23111827'/%3E%3Ccircle cx='60' cy='60' r='34' fill='%2322d3ee' opacity='.75'/%3E%3Cpath d='M24 60h72' stroke='%23fff' stroke-width='8'/%3E%3C/svg%3E";
        };
        card.appendChild(img);
        let name = document.createElement('span');
        name.textContent = p.name;
        card.appendChild(name);
        card.onclick = function() {
          showDetail(id);
        };
        pokemonGrid.appendChild(card);
      });
    }
    if (pageInfo) pageInfo.textContent = 'Page ' + (Math.floor(currentOffset / 20) + 1);
  }

  async function showDetail(id) {
    try {
      let url = 'https://pokeapi.co/api/v2/pokemon/' + id;
      let r = await fetch(url);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      let d = await r.json();
      let speciesUrl = 'https://pokeapi.co/api/v2/pokemon-species/' + id;
      let speciesR = await fetch(speciesUrl);
      if (!speciesR.ok) throw new Error('HTTP ' + speciesR.status);
      let speciesD = await speciesR.json();
      let html = '<h2>' + d.name + '</h2>';
      html += '<p>Height: ' + d.height + '</p>';
      html += '<p>Weight: ' + d.weight + '</p>';
      html += '<p>Types: ' + d.types.map(function(t) { return t.type.name; }).join(', ') + '</p>';
      html += '<p>Stats: ' + d.stats.map(function(s) { return s.base + ' ' + s.stat.name; }).join(', ') + '</p>';
      if (speciesD.flavor_text_entries && speciesD.flavor_text_entries.length > 0) {
        html += '<p>Description: ' + speciesD.flavor_text_entries[0].flavor_text + '</p>';
      }
      if (modalContent) modalContent.innerHTML = html;
      if (detailModal) detailModal.style.display = 'block';
    } catch(e) {
      showError(e.message);
    }
  }

  function closeDetail() {
    if (detailModal) detailModal.style.display = 'none';
  }

  function setupSearch() {
    if (searchInput) {
      searchInput.addEventListener('input', function(e) {
        let term = e.target.value.toLowerCase();
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(function() {
          filteredPokemon = allPokemon.filter(function(p) {
            return p.name.includes(term);
          });
          renderCards();
        }, 300);
      });
    }
  }

  function setupFilters() {
    // Placeholder for type filters logic
  }

  function setupPagination() {
    if (prevBtn) {
      prevBtn.addEventListener('click', function() {
        if (currentOffset > 0) {
          currentOffset -= 20;
          fetchPokemonList(currentOffset);
        }
      });
    }
    if (nextBtn) {
      nextBtn.addEventListener('click', function() {
        currentOffset += 20;
        fetchPokemonList(currentOffset);
      });
    }
  }

  function showError(msg) {
    if (errorState) {
      errorState.style.display = 'block';
      errorState.textContent = 'Error: ' + msg;
    }
  }

  setupSearch();
  setupFilters();
  setupPagination();
  if (modalClose) modalClose.addEventListener('click', closeDetail);
  fetchPokemonList(0);
})().catch(function(err) { console.error('Init error:', err); });
</script>
</body>
</html>
